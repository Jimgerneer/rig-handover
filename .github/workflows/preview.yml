# Preview for review (plan.md § 3, § 4; ADR 0003). Runs rig, saves /digest/2026-10-28 as one HTML
# file and deploys it to GitHub Pages. Nothing is committed: the page only lives on Pages, so a
# re-run with marker=false uploads over the same link without the lane marker.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker (false for the clean-up)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
